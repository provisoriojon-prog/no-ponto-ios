name: NoPonto
options:
  bundleIdPrefix: br.com.provisoriojon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  NoPonto:
    type: application
    platform: iOS
    sources:
      - path: NoPonto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.provisoriojon.noponto
        PRODUCT_NAME: NoPonto
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NoPonto/Info.plist
      properties:
        CFBundleDisplayName: No Ponto
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Sua localização ajuda a encontrar pontos próximos e orientar o mapa. Você escolhe o ponto e o sentido de embarque.
        NSLocationTemporaryUsageDescriptionDictionary:
          ConfirmarPonto: A localização precisa ajuda a distinguir pontos próximos. Você sempre pode escolher o ponto manualmente.
  NoPontoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: NoPonto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  NoPontoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: NoPonto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NoPonto:
    build:
      targets:
        NoPonto: all
        NoPontoTests: [test]
        NoPontoUITests: [test]
    test:
      config: Debug
      targets:
        - NoPontoTests
        - NoPontoUITests
    archive:
      config: Release
